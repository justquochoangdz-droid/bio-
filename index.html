
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Profile cá nhân 75ONTOP - TikTok, Zalo và ZaloPay.">
  <title>75ONTOP | Personal Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d9b66f;
      --black: #080808;
      --muted: #a7a7a7;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 50% 0%, #292318 0%, transparent 48%),
        linear-gradient(145deg, #111111, #050505 65%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile {
      width: 100%;
      max-width: 410px;
      padding: 35px 25px 27px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(217, 182, 111, .35);
      border-radius: 27px;
      background: linear-gradient(
        150deg,
        rgba(35, 32, 26, .95),
        rgba(10, 10, 10, .98) 55%
      );
      box-shadow: 0 25px 80px #000, 0 0 35px #d9b66f12;
    }

    .profile::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      top: -150px;
      left: calc(50% - 110px);
      background: var(--gold);
      filter: blur(90px);
      opacity: .25;
      pointer-events: none;
    }

    .brand {
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: linear-gradient(145deg, #34302a, #090909);
      box-shadow: 0 0 25px #d9b66f25;
    }

    .avatar span {
      color: var(--gold);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }

    .line {
      width: 55px;
      height: 2px;
      margin: 0 auto 25px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      text-align: left;
      text-decoration: none;
      color: #fff;
      background: #ffffff06;
      border: 1px solid #ffffff17;
      border-radius: 15px;
      transition: .25s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      background: #d9b66f0c;
      box-shadow: 0 8px 25px #0006;
    }

    .icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #d9b66f12;
      color: var(--gold);
      font-size: 21px;
      font-weight: bold;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .info strong {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .info small {
      color: #a6a6a6;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .arrow {
      color: var(--gold);
      font-size: 20px;
    }

    .footer {
      margin-top: 27px;
      color: #777;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .footer span {
      color: var(--gold);
    }

    @media (max-width: 360px) {
      .profile { padding: 28px 17px 23px; }
      h1 { font-size: 27px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="profile">
    <div class="brand">PERSONAL PROFILE</div>

    <div class="avatar" aria-label="Logo 75ONTOP">
      <span>75</span>
    </div>

    <h1>75ONTOP</h1>
    <p class="subtitle">SIMPLE · LUXURY · PREMIUM</p>
    <div class="line"></div>

    <nav class="links" aria-label="Liên kết cá nhân">

      <a class="link"
         href="https://www.tiktok.com/@75ontop__"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon">♪</span>
        <span class="info">
          <strong>TikTok</strong>
          <small>@75ontop__</small>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://zalo.me/0793089475"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon">Z</span>
        <span class="info">
          <strong>Zalo</strong>
          <small>0793 089 475</small>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="tel:0914482121">
        <span class="icon">₫</span>
        <span class="info">
          <strong>ZaloPay</strong>
          <small>0914 482 121</small>
        </span>
        <span class="arrow">↗</span>
      </a>

    </nav>

    <div class="footer">
      © 2026 <span>75ONTOP</span> · ALL RIGHTS RESERVED
    </div>
  </main>
</body>
</html>
